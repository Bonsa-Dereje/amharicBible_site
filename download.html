<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Amharic Bible</title>
    </head>
    <body>
        <header>
            <table width="100%">
                <tbody>
                    <tr>
                        <td align="left">
                            <h1>Amharic Bible</h1>
                        </td>
                        <td align="right">
                            <nav>
                                <a href="index.html">Home</a>
                                &nbsp; | &nbsp;
                                <a href="features.html">Features</a>
                            </nav>
                        </td>
                    </tr>
                </tbody>
            </table>
        </header>

        <section>
            <table width="100%">
                <tbody>
                    <tr>
                        <td align="center">
                            <form>
                                Enter your email:
                                <br />
                                <input
                                    type="email"
                                    name="email"
                                    placeholder="you@example.com"
                                    required
                                />
                                <br />
                                <br />
                                Select your platform:
                                <br />
                                <input
                                    type="radio"
                                    name="platform"
                                    value="Windows"
                                    required
                                />
                                Windows
                                <input
                                    type="radio"
                                    name="platform"
                                    value="Linux"
                                />
                                Linux
                                <input
                                    type="radio"
                                    name="platform"
                                    value="ARM"
                                />
                                ARM
                                <br />
                                <br />
                                <input
                                    type="submit"
                                    value="Get Download Link"
                                />
                            </form>
                            <br />
                            <img
                                src="./assets/download.png"
                                alt="Download the App"
                                width="15%"
                            />
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </body>
</html>
